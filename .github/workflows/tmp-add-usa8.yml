name: temporary USA 8 updater

on:
  push:
    branches:
      - tmp-add-usa8-20260830

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary USA 8 updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add USA 8 feed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('us-filtered-houston.m3u')
          lines = path.read_text(encoding='utf-8').splitlines()
          header = lines[0]

          blocks=[]
          i=1
          while i < len(lines):
              if not lines[i].startswith('#EXTINF'):
                  i += 1
                  continue
              block=[lines[i]]
              i += 1
              while i < len(lines) and not lines[i].startswith('#EXTINF'):
                  block.append(lines[i])
                  i += 1
                  if block[-1].strip() and not block[-1].startswith('#'):
                      break
              blocks.append(block)

          names=[b[0].split(',',1)[1] for b in blocks if ',' in b[0]]
          if 'USA 8' in names:
              raise SystemExit('USA 8 already exists')

          try:
              insert_at = next(i for i,b in enumerate(blocks) if b[0].split(',',1)[1].startswith('NBCSN 720p'))
          except StopIteration:
              raise SystemExit('NBCSN anchor not found')

          trial=[
              '#EXTINF:-1 tvg-id="USA.Network.HD.us2" tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/USA_Network_logo_%282016%29.svg/960px-USA_Network_logo_%282016%29.svg.png" group-title="Sports",USA 8',
              'http://fl2.moveonjoy.com/USA_Network/index.m3u8'
          ]
          blocks.insert(insert_at, trial)

          for idx,b in enumerate(blocks, start=1):
              first = re.sub(r'\s+tvg-chno="[^"]*"', '', b[0])
              first = re.sub(r'\s+channel-number="[^"]*"', '', first)
              meta,title = first.split(',',1)
              b[0] = f'{meta} tvg-chno="{idx}" channel-number="{idx}",{title}'

          path.write_text(header+'\n'+'\n'.join('\n'.join(b) for b in blocks)+'\n', encoding='utf-8')
          PY
      - name: Commit playlist update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u
          git commit -m "Add USA 8 trial feed"
          git push
