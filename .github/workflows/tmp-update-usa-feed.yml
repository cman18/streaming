name: temporary USA feed updater

on:
  push:
    branches:
      - tmp-update-usa-feed-20260823

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary USA feed updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only USA 1080p (1) stream URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('us-filtered-houston.m3u')
          old = 'https://tvpass.org/live/USANetworkEast/hd'
          new = 'http://190.11.225.124:5000/live/usa_hd/playlist.m3u8'
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old USA URL, found {text.count(old)}')
          if new in text:
              raise SystemExit('New USA URL already present; refusing unexpected duplicate')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit playlist update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Update USA 1080p (1) feed"
          git push
