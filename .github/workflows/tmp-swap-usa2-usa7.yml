name: temporary USA 2 and USA 7 swap

on:
  push:
    branches:
      - tmp-swap-usa2-usa7-20260830

permissions:
  contents: write

jobs:
  swap:
    if: github.event.head_commit.message == 'temporary USA 2 and USA 7 swap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap USA 2 and USA 7 labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('us-filtered-houston.m3u')
          s = p.read_text()
          old2 = ',USA 2 1080p\nhttps://gpuserver5.tier1streams.com/USA_NETWORK/index.m3u8'
          old7 = ',USA 7 576p\nhttps://tvsen3.aynaott.com/dbbcY6NG/index.m3u8'
          assert s.count(old2) == 1, s.count(old2)
          assert s.count(old7) == 1, s.count(old7)
          s = s.replace(old2, ',USA 7 1080p\nhttps://gpuserver5.tier1streams.com/USA_NETWORK/index.m3u8')
          s = s.replace(old7, ',USA 2 576p\nhttps://tvsen3.aynaott.com/dbbcY6NG/index.m3u8')
          p.write_text(s)
      - name: Commit playlist change
        run: |
          git config user.name "cman18"
          git config user.email "coffeemanhou@gmail.com"
          git add us-filtered-houston.m3u
          git commit -m "Swap USA 2 and USA 7 labels"
          git push
