name: Update USA playlist once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add one-time USA playlist updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update USA Network entries
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('us-filtered-houston.m3u')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          # Preserve the existing three USA URLs, then add the current USA Network East feed.
          usa_urls = []
          i = 1
          while i + 1 < len(lines) and lines[i].startswith('#EXTINF') and 'USA.Network' in lines[i]:
              usa_urls.append(lines[i + 1])
              i += 2

          if len(usa_urls) < 3:
              raise SystemExit(f'Expected at least 3 USA streams at top of playlist, found {len(usa_urls)}')

          usa_urls = usa_urls[:3] + ['https://tvpass.org/live/USANetworkEast/hd']
          logo = 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/USA_Network_logo_%282016%29.svg/960px-USA_Network_logo_%282016%29.svg.png'
          names = ['USA 1080p (1)', 'USA 1080p (2)', 'USA (1)', 'USA 1080p (3)']

          new_top = [lines[0]]
          for n, (name, url) in enumerate(zip(names, usa_urls), start=1):
              new_top.append(f'#EXTINF:-1 tvg-id="USA.Network.HD.us2" tvg-logo="{logo}" group-title="Sports" tvg-chno="{n}" channel-number="{n}",{name}')
              new_top.append(url)

          rest = lines[i:]
          shifted = []
          for line in rest:
              if line.startswith('#EXTINF'):
                  line = re.sub(r'tvg-chno="(\d+)"', lambda m: f'tvg-chno="{int(m.group(1))+1}"' if int(m.group(1)) >= 4 else m.group(0), line)
                  line = re.sub(r'channel-number="(\d+)"', lambda m: f'channel-number="{int(m.group(1))+1}"' if int(m.group(1)) >= 4 else m.group(0), line)
              shifted.append(line)

          path.write_text('\n'.join(new_top + shifted) + '\n', encoding='utf-8')

      - name: Commit playlist update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u
          git commit -m "Add fourth USA Network stream"
          git push
