name: temporary USA 7 updater

on:
  push:
    branches:
      - tmp-add-usa7-20260830

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary USA 7 updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add USA 7 feed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('us-filtered-houston.m3u')
          lines = path.read_text(encoding='utf-8').splitlines()

          target_name = 'USA 6'
          new_name = 'USA 7 576p'
          new_url = 'https://tvsen3.aynaott.com/dbbcY6NG/index.m3u8'

          if any(new_url == x.strip() for x in lines):
              raise SystemExit('New URL already present')

          insert_at = None
          for i, line in enumerate(lines):
              if line.startswith('#EXTINF') and line.endswith(',' + target_name):
                  # insert after this channel's URL line
                  insert_at = i + 2
                  break
          if insert_at is None:
              raise SystemExit('Could not find USA 6 entry')

          new_meta = '#EXTINF:-1 tvg-id="USANetwork.us@East" tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/USA_Network_logo_%282016%29.svg/960px-USA_Network_logo_%282016%29.svg.png" group-title="Sports" tvg-chno="7" channel-number="7",' + new_name
          lines[insert_at:insert_at] = [new_meta, new_url]

          # Renumber every following channel sequentially, preserving all other metadata and names.
          channel_no = 0
          for idx, line in enumerate(lines):
              if not line.startswith('#EXTINF'):
                  continue
              channel_no += 1
              line = re.sub(r'\s+tvg-chno="[^"]*"', '', line)
              line = re.sub(r'\s+channel-number="[^"]*"', '', line)
              meta, title = line.split(',', 1)
              lines[idx] = f'{meta} tvg-chno="{channel_no}" channel-number="{channel_no}",{title}'

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit playlist update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u
          git commit -m "Add USA 7 feed"
          git push
