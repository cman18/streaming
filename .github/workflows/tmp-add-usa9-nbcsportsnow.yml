name: temporary USA 9 and NBC Sports NOW updater

on:
  push:
    branches:
      - tmp-add-usa9-nbcsportsnow-20260830

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary USA 9 and NBC Sports NOW updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update playlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('us-filtered-houston.m3u')
          lines = path.read_text(encoding='utf-8').splitlines()
          header = lines[0]

          blocks = []
          i = 1
          while i < len(lines):
              if not lines[i].startswith('#EXTINF'):
                  i += 1
                  continue
              block = [lines[i]]
              i += 1
              while i < len(lines) and not lines[i].startswith('#EXTINF'):
                  block.append(lines[i])
                  i += 1
                  if block[-1].strip() and not block[-1].startswith('#'):
                      break
              blocks.append(block)

          def name_of(block):
              return block[0].split(',', 1)[1] if ',' in block[0] else ''

          if not any(name_of(b) == 'USA 9' for b in blocks):
              usa9 = [
                  '#EXTINF:-1 tvg-id="USA.Network.HD.us2" tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/USA_Network_logo_%282016%29.svg/960px-USA_Network_logo_%282016%29.svg.png" group-title="Sports",USA 9',
                  'https://fl1.moveonjoy.com/USA_NETWORK/index.m3u8'
              ]
              insert_at = next(i for i,b in enumerate(blocks) if name_of(b) == 'NBCSN 720p')
              blocks.insert(insert_at, usa9)

          if not any(name_of(b) == 'NBC Sports NOW' for b in blocks):
              nbcsportsnow = [
                  '#EXTINF:-1 group-title="Sports",NBC Sports NOW',
                  'https://d4whmvwm0rdvi.cloudfront.net/10007/99993008/hls/master.m3u8?ads.xumo_channelId=99993008'
              ]
              nbcsn_index = next(i for i,b in enumerate(blocks) if name_of(b) == 'NBCSN 720p')
              blocks.insert(nbcsn_index + 1, nbcsportsnow)

          for idx, block in enumerate(blocks, start=1):
              first = re.sub(r'\s+tvg-chno="[^"]*"', '', block[0])
              first = re.sub(r'\s+channel-number="[^"]*"', '', first)
              meta, title = first.split(',', 1)
              block[0] = f'{meta} tvg-chno="{idx}" channel-number="{idx}",{title}'

          path.write_text(header + '\n' + '\n'.join('\n'.join(b) for b in blocks) + '\n', encoding='utf-8')
          PY
      - name: Commit playlist update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u
          git commit -m "Add USA 9 and NBC Sports NOW"
          git push
