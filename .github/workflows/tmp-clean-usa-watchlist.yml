name: temporary USA cleanup and watchlist

on:
  push:
    branches:
      - tmp-clean-usa-watchlist-20260919

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary USA cleanup watchlist workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-clean-usa-watchlist-20260919
      - name: Keep USA 1 and new test feed, archive old USA feeds
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p=Path('us-filtered-houston.m3u')
          lines=p.read_text(encoding='utf-8').splitlines()
          header=lines[0]
          records=[]
          i=1
          while i < len(lines):
              if lines[i].startswith('#EXTINF:'):
                  rec=[lines[i]]
                  i+=1
                  while i < len(lines) and not lines[i].startswith('#EXTINF:'):
                      rec.append(lines[i]); i+=1
                  records.append(rec)
              else:
                  i+=1

          def name(rec):
              return rec[0].split(',',1)[1] if ',' in rec[0] else ''
          def url(rec):
              for x in rec[1:]:
                  if x and not x.startswith('#'):
                      return x.strip()
              return ''

          usa_re=re.compile(r'^USA\s+(\d+)')
          archived=[]
          kept=[]
          for rec in records:
              n=name(rec)
              m=usa_re.match(n)
              if not m:
                  kept.append(rec)
                  continue
              num=int(m.group(1))
              if num==1:
                  kept.append(rec)
              elif num==11:
                  first=rec[0]
                  first=re.sub(r',USA 11 360p$', ',USA 2 360p', first)
                  rec=[first]+rec[1:]
                  kept.append(rec)
              else:
                  archived.append((n,url(rec)))

          out=[header]
          for idx,rec in enumerate(kept,1):
              first=rec[0]
              first=re.sub(r'\s+tvg-chno="[^"]*"', '', first)
              first=re.sub(r'\s+channel-number="[^"]*"', '', first)
              left,right=first.split(',',1)
              out.append(f'{left} tvg-chno="{idx}" channel-number="{idx}",{right}')
              out.extend(rec[1:])
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')

          w=Path('usa-feed-watchlist.md')
          md=[
              '# USA Network feed watchlist',
              '',
              'Removed from the active playlist on 2026-09-19 because they were not working reliably. Keep these for future retesting; do not re-add without testing.',
              '',
              '| Previous name | Stream URL |',
              '|---|---|',
          ]
          for n,u in archived:
              md.append(f'| {n} | {u} |')
          w.write_text('\n'.join(md)+'\n',encoding='utf-8')
          PY
          git config user.name cman18
          git config user.email coffeemanhou@gmail.com
          git add us-filtered-houston.m3u usa-feed-watchlist.md
          git commit -m "Clean USA feeds and archive old candidates" || exit 0
          git push
