name: temporary trial feeds update

on:
  push:
    branches:
      - tmp-add-trial-feeds-20260918

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary trial feeds workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-add-trial-feeds-20260918
      - name: Add USA FOX and ESPN trial feeds
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path('us-filtered-houston.m3u')
          lines = p.read_text(encoding='utf-8').splitlines()
          header = lines[0]
          records = []
          i = 1
          while i < len(lines):
              if lines[i].startswith('#EXTINF:'):
                  rec = [lines[i]]
                  i += 1
                  while i < len(lines) and not lines[i].startswith('#EXTINF:'):
                      rec.append(lines[i])
                      i += 1
                  records.append(rec)
              else:
                  i += 1

          def name(rec):
              return rec[0].split(',',1)[1] if ',' in rec[0] else ''

          def url(rec):
              for x in rec[1:]:
                  if x and not x.startswith('#'):
                      return x.strip()
              return ''

          existing_urls = {url(r) for r in records}

          usa10 = [
              '#EXTINF:-1 tvg-id="USANetwork.us@East" group-title="Sports",USA 10 720p',
              'https://e3.thetvapp.to/hls/USANetworkEast/tracks-v2a1/mono.m3u8'
          ]

          fox_new = [
              ['#EXTINF:-1 tvg-id="Fox.us@East" group-title="Sports",FOX East 1 720p',
               'http://stream.cammonitorplus.net/1752/index.m3u8'],
              ['#EXTINF:-1 tvg-id="Fox.us@East" group-title="Sports",FOX East 2 720p',
               'http://40.160.24.52/FOX/index.m3u8'],
              ['#EXTINF:-1 tvg-id="Fox.us@East" group-title="Sports",FOX East 3 720p',
               'https://fl1.moveonjoy.com/FOX/index.m3u8'],
          ]

          espn_new = [
              ['#EXTINF:-1 tvg-id="ESPN.HD.us2" group-title="Sports",ESPN Trial',
               'http://fl1.moveonjoy.com/ESPN/index.m3u8'],
              ['#EXTINF:-1 tvg-id="ESPN2.HD.us2" group-title="Sports",ESPN2 Trial',
               'http://fl2.moveonjoy.com/ESPN_2/index.m3u8'],
              ['#EXTINF:-1 tvg-id="ESPNews.us@SD" group-title="Sports",ESPNews Trial',
               'http://fl2.moveonjoy.com/ESPN_NEWS/index.m3u8'],
          ]

          if usa10[1] not in existing_urls:
              idx = next(i for i,r in enumerate(records) if name(r).startswith('NBCSN'))
              records.insert(idx, usa10)
              existing_urls.add(usa10[1])

          for rec in fox_new:
              if rec[1] not in existing_urls:
                  # insert after the last FOX broadcast/East entry, before FS1
                  idx = next(i for i,r in enumerate(records) if name(r).startswith('Fox Sports 1'))
                  records.insert(idx, rec)
                  existing_urls.add(rec[1])

          # Place ESPN/ESPN2/ESPNews immediately after Golazo Network and before existing ESPNU
          insert_idx = next(i for i,r in enumerate(records) if name(r) == 'Golazo Network (720p)') + 1
          to_add = [r for r in espn_new if r[1] not in existing_urls]
          records[insert_idx:insert_idx] = to_add

          out = [header]
          for idx, rec in enumerate(records, 1):
              first = rec[0]
              first = re.sub(r'\s+tvg-chno="[^"]*"', '', first)
              first = re.sub(r'\s+channel-number="[^"]*"', '', first)
              if ',' in first:
                  left, right = first.split(',',1)
                  first = f'{left} tvg-chno="{idx}" channel-number="{idx}",{right}'
              out.append(first)
              out.extend(rec[1:])
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          git config user.name cman18
          git config user.email coffeemanhou@gmail.com
          git add us-filtered-houston.m3u
          git commit -m "Add new USA FOX and ESPN trial feeds" || exit 0
          git push
