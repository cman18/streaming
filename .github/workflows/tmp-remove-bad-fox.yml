name: temporary remove bad fox

on:
  push:
    branches:
      - tmp-remove-bad-fox-20260919

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'temporary remove bad fox workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-remove-bad-fox-20260919
      - name: Remove bad generic FOX feed
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('us-filtered-houston.m3u')
          lines=p.read_text(encoding='utf-8').splitlines()
          header=lines[0]
          records=[]
          i=1
          while i<len(lines):
              if lines[i].startswith('#EXTINF:'):
                  rec=[lines[i]]; i+=1
                  while i<len(lines) and not lines[i].startswith('#EXTINF:'):
                      rec.append(lines[i]); i+=1
                  records.append(rec)
              else:
                  i+=1
          bad='https://messi.damitv.st/papi/ts/fox-usa/playlist.m3u8'
          def url(rec):
              for x in rec[1:]:
                  if x and not x.startswith('#'): return x.strip()
              return ''
          records=[r for r in records if url(r)!=bad]
          out=[header]
          for idx,rec in enumerate(records,1):
              first=rec[0]
              first=re.sub(r'\s+tvg-chno="[^"]*"', '', first)
              first=re.sub(r'\s+channel-number="[^"]*"', '', first)
              left,right=first.split(',',1)
              out.append(f'{left} tvg-chno="{idx}" channel-number="{idx}",{right}')
              out.extend(rec[1:])
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name cman18
          git config user.email coffeemanhou@gmail.com
          git add us-filtered-houston.m3u
          git commit -m "Remove nonworking generic FOX feed" || exit 0
          git push
