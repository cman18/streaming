name: Add tracked USA Network candidates once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add tracked USA Network candidates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add candidates and tracking log
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('us-filtered-houston.m3u')
          lines=p.read_text().splitlines()
          # insert after USA 4 URL
          insert_at=9
          logo='https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/USA_Network_logo_%282016%29.svg/960px-USA_Network_logo_%282016%29.svg.png'
          extra=[
            f'#EXTINF:-1 tvg-id="USANetwork.us@East" tvg-logo="{logo}" group-title="Sports" tvg-chno="5" channel-number="5",USA 5 576p',
            'https://trs1.aynaott.com/usa/index.m3u8',
            f'#EXTINF:-1 tvg-id="USA.Network.HD.us2" tvg-logo="{logo}" group-title="Sports" tvg-chno="6" channel-number="6",USA 6',
            'http://23.237.104.106:8080/USA_NETWORK/index.m3u8?takodachi',
          ]
          rest=[]
          for line in lines[insert_at:]:
            if line.startswith('#EXTINF'):
              line=re.sub(r'tvg-chno="(\d+)"',lambda m:f'tvg-chno="{int(m.group(1))+2}"' if int(m.group(1))>=5 else m.group(0),line)
              line=re.sub(r'channel-number="(\d+)"',lambda m:f'channel-number="{int(m.group(1))+2}"' if int(m.group(1))>=5 else m.group(0),line)
            rest.append(line)
          p.write_text('\n'.join(lines[:insert_at]+extra+rest)+'\n')

          Path('USA-FEED-TRACKING.md').write_text('''# USA Network Feed Tracking\n\nKeep this file as the permanent history of USA Network candidates. Do not reuse a number for a different URL after removal.\n\n| ID | Label | Source/status when added |\n|---|---|---|\n| USA 1 | USA 1 1080p | Existing; reported working 2026-08-29 |\n| USA 2 | USA 2 1080p | Existing; reported not working 2026-08-29 |\n| USA 3 | USA 3 | Existing; resolution unknown; reported not working 2026-08-29 |\n| USA 4 | USA 4 1080p | Added 2026-08-29; reported not working 2026-08-29 |\n| USA 5 | USA 5 576p | Added 2026-08-29; iptv-org approved add request #41312 (USA Network East) |\n| USA 6 | USA 6 | Added 2026-08-29; candidate from iptv-org discussion #1500; resolution unknown |\n''')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us-filtered-houston.m3u USA-FEED-TRACKING.md
          git commit -m "Add USA 5 and USA 6 with tracking log"
          git push
